name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Run full OS / Python matrix"
        type: boolean
        default: false

jobs:
  smoke:
    name: smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event.inputs.full_matrix == 'true' && '{"os":["ubuntu-latest","macos-latest","windows-latest"],"python-version":["3.10","3.11","3.12","3.13"]}' || '{"os":["ubuntu-latest"],"python-version":["3.12"]}') }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt platform plugin deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0

      - name: Install kdk
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest tests/ -q

      - name: Lint
        run: ruff check .

      - name: Type check
        run: pyright

      - name: Verify entry points
        run: |
          kdk --help
          kdk validate --help

      - name: Verify GUI imports (no display)
        run: python -c "from kdk.gui.app import KdkApp, run_gui; print('gui imports ok')"

      - name: Run validator on fixture (clean - expects exit 0)
        run: kdk validate tests/fixtures/clean_skin

      # The README advertises this exit code for CI use.
      - name: Run validator on fixture (dirty - expects exit 1)
        shell: bash
        run: |
          for mode in "" "--json"; do
            kdk validate tests/fixtures/dirty_skin $mode > /dev/null && {
              echo "expected non-zero exit for dirty fixture (mode='${mode:-text}')"; exit 1; }
          done
