name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to draft a release for (e.g. v0.1.0). Empty only builds and smoke-tests."
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os_label }}-${{ matrix.arch_label }})
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ github.event.inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_label: linux
            arch_label: x86_64
            artifact_ext: ""
          - os: windows-latest
            os_label: windows
            arch_label: x86_64
            artifact_ext: ".exe"
          # macos-latest on GitHub-hosted runners is Apple Silicon (arm64).
          - os: macos-latest
            os_label: macos
            arch_label: arm64
            artifact_ext: ""
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Qt platform plugin deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0

      - name: Install build deps
        run: pip install -e ".[build]"

      - name: Build PyInstaller binary
        run: python make_binaries.py

      - name: Smoke-test built binary (CLI)
        shell: bash
        run: |
          ./dist/kdk${{ matrix.artifact_ext }} --help
          ./dist/kdk${{ matrix.artifact_ext }} validate tests/fixtures/clean_skin
          ./dist/kdk${{ matrix.artifact_ext }} validate --json --isolated --exit-zero tests/fixtures/clean_skin > smoke.json
          python -c "import json, sys; n = json.load(open('smoke.json'))['notices']; sys.exit(f'notices: {n}' if n else 0)"

      - name: Rename binaries
        shell: bash
        env:
          BASE: kdk-${{ matrix.os_label }}-${{ matrix.arch_label }}
        run: |
          CLI_NAME="kdk-cli-${VERSION}-${{ matrix.os_label }}-${{ matrix.arch_label }}"
          GUI_NAME="kdk-gui-${VERSION}-${{ matrix.os_label }}-${{ matrix.arch_label }}"
          mv "dist/kdk${{ matrix.artifact_ext }}" "dist/${CLI_NAME}${{ matrix.artifact_ext }}"
          mv "dist/kdk-gui${{ matrix.artifact_ext }}" "dist/${GUI_NAME}${{ matrix.artifact_ext }}"
          echo "CLI_NAME=${CLI_NAME}" >> "$GITHUB_ENV"
          echo "GUI_NAME=${GUI_NAME}" >> "$GITHUB_ENV"

      - name: Archive binaries (non-Windows)
        shell: bash
        working-directory: dist
        run: |
          case "${{ runner.os }}" in
            macOS)
              # .zip preserves exec bit via macOS' extended attrs.
              zip "${CLI_NAME}.zip" "${CLI_NAME}"
              zip "${GUI_NAME}.zip" "${GUI_NAME}"
              rm -f "${CLI_NAME}" "${GUI_NAME}"
              ;;
            Linux)
              # tar.gz preserves the exec bit reliably across all extractors.
              tar -czf "${CLI_NAME}.tar.gz" "${CLI_NAME}"
              tar -czf "${GUI_NAME}.tar.gz" "${GUI_NAME}"
              rm -f "${CLI_NAME}" "${GUI_NAME}"
              ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kdk-${{ matrix.os_label }}-${{ matrix.arch_label }}
          # Bare path matches only on Windows (raw .exe); archive paths match
          # only on Linux/macOS. `if-no-files-found: ignore` skips the rest.
          path: |
            dist/${{ env.CLI_NAME }}${{ matrix.artifact_ext }}
            dist/${{ env.CLI_NAME }}.zip
            dist/${{ env.CLI_NAME }}.tar.gz
            dist/${{ env.GUI_NAME }}${{ matrix.artifact_ext }}
            dist/${{ env.GUI_NAME }}.zip
            dist/${{ env.GUI_NAME }}.tar.gz
          if-no-files-found: ignore
          retention-days: 7

  build-wheel:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Smoke-test the wheel in a clean venv
        working-directory: ${{ runner.temp }}
        env:
          FIXTURES: ${{ github.workspace }}/tests/fixtures
        run: |
          python -m venv wheel-env
          wheel-env/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          wheel-env/bin/kdk validate --json --isolated --exit-zero -o clean.json "$FIXTURES/clean_skin"
          python -c "import json, sys; n = json.load(open('clean.json'))['notices']; sys.exit(f'notices: {n}' if n else 0)"
          wheel-env/bin/kdk compare --json --isolated --exit-zero clean.json "$FIXTURES/dirty_skin" > compare.json
          wheel-env/bin/kdk rules --json > rules.json
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-sdist
          path: dist/*

  publish:
    name: publish to PyPI
    needs: build-wheel
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    environment: pypi
    # Trusted publishing: PyPI verifies this workflow's OIDC claim, so no token
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheel-sdist
          path: dist/
      # A PyPI version can only be uploaded once, so a re-run must not fail here
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          skip-existing: true

  release:
    name: publish GitHub Release
    needs: [build, build-wheel]
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "kdk-*" -o -name "*.whl" -o -name "*.tar.gz" \) -exec cp {} release/ \;
          ls -la release/

      - name: Extract CHANGELOG section for this tag
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          BARE="${VERSION#v}"
          awk -v ver="$BARE" '
            /^## \[/ {
              if (in_section) exit;
              if ($0 ~ "^## \\[" ver "\\]") { in_section=1; next }
              next
            }
            in_section
          ' CHANGELOG.md > release_body.md
          # Fallback if no matching section (or CHANGELOG missing).
          if [ ! -s release_body.md ]; then
            echo "Release ${VERSION}" > release_body.md
          fi
          echo "--- release body ---"
          cat release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          body_path: release_body.md
          files: release/*
