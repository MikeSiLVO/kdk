[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kdk"
dynamic = ["version"]
description = "Kodi skin validation tool - CLI and GUI"
readme = "README.md"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "MikeSiLVO", email = "mikesilvo164@gmail.com" },
]
dependencies = [
    "lxml>=4.9",
    "rich>=13.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Multimedia",
]

[project.urls]
Homepage = "https://github.com/MikeSiLVO/kdk"
Repository = "https://github.com/MikeSiLVO/kdk"
Issues = "https://github.com/MikeSiLVO/kdk/issues"

[project.optional-dependencies]
# Out of the core deps so a CLI-only install doesn't pull ~100MB of Qt
gui = [
    "PySide6>=6.6",
]
build = [
    "kdk[gui]",
    "pyinstaller>=6.0",
    # `scripts/make_icon.py` uses Pillow to pack the multi-rez .ico.
    "Pillow>=10.0",
]
dev = [
    # pyright type-checks `gui/`, so the dev env needs Qt even though tests don't.
    "kdk[gui]",
    "pytest>=8.0",
    # Pinned so a tool release cannot change what CI enforces without a commit
    # saying so. CI installs this extra, so local matches by installing it too.
    "pyright==1.1.411",
    "ruff==0.16.1",
]

[project.scripts]
kdk = "kdk.__main__:main"

[project.gui-scripts]
kdk-gui = "kdk.gui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kdk = ["data/**/*"]

[tool.setuptools.dynamic]
version = { attr = "kdk.__version__" }

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
# `src/kdk` so the shared tests resolve `libs.*` the way conftest.py aliases it
# at runtime; `tests` for the sublime mock they import.
extraPaths = ["src", "src/kdk", "tests"]
exclude = ["src/kdk/libs/polib", "build", "dist", "typings"]
# Hand-written stubs modelling how this codebase actually uses lxml, and the
# guarded sublime import in the shared engine.
stubPath = "typings"

[tool.ruff]
target-version = "py310"
line-length = 120
# Vendored upstream, kept byte-identical so it can be re-vendored.
exclude = ["src/kdk/libs/polib"]

[tool.ruff.lint]
# Stated rather than inherited: ruff 0.16 widened its default set, which changed
# what CI enforced without anything here changing.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# sys.path setup has to precede the imports.
"tests/*.py" = ["E402"]
